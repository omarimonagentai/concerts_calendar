name: Actualitza Concerts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instal·la dependències
        run: pip install requests beautifulsoup4 anthropic

      - name: Executa actualització automàtica
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python update_concerts.py --auto --apply

      - name: Commit i push si hi ha canvis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add concerts.json artists.json
          git diff --staged --quiet || git commit -m "chore: actualitza concerts [skip ci]"
          git push
